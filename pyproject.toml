[project]
name = "milvus-dataset"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "zhuwenxing", email = "wenxing.zhu@zilliz.com"},
]
dependencies = ["pydantic>=2.10.3", "pandas>=2.2.3", "fsspec>=2024.10.0", "pyarrow>=18.1.0", "s3fs>=2024.10.0", "gcsfs>=2024.10.0", "tqdm>=4.67.1", "loguru>=0.7.3", "scikit-learn>=1.6.0", "pymilvus>=2.5.0", "numba>=0.60.0", "datasets>=2.14.4", "colorama>=0.4.6"]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[dependency-groups]
lint = [
    "ruff>=0.8.3",
]
test = [
    "pytest>=8.3.4",
]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
    "N",  # pep8-naming
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["milvus_dataset"]
